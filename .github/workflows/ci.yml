name: CI

# Checks this package on every push: composer.json is valid, the recipe
# parses and Deployer can load it, and the server scripts pass ShellCheck.
# No server is contacted.

on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install Deployer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint the recipe
        run: php -l recipe/laravel-hestia.php

      # A throwaway deploy.php with one fake site: proves the recipe loads and
      # the task order is intact, without connecting anywhere.
      - name: Load the recipe in Deployer
        run: |
          cat > deploy.php <<'PHP'
          <?php
          namespace Deployer;
          require __DIR__.'/recipe/laravel-hestia.php';
          set('repository', 'git@github.com:example/app.git');
          site('app.example.test', 'dev')->setHostname('192.0.2.1')->setRemoteUser('app')->setDeployPath('/srv/app');
          PHP
          vendor/bin/dep tree deploy
          vendor/bin/dep deploy branch=dev --plan

      # ShellCheck comes with GitHub's Ubuntu runners. --help runs before
      # the scripts look for root or HestiaCP.
      - name: Check the server scripts
        run: |
          shellcheck --external-sources server/lib.sh server/add-user server/add-domain server/setup-redis server/use-redis server/use-horizon server/setup-reverb server/use-reverb
          for script in add-user add-domain setup-redis use-redis use-horizon setup-reverb use-reverb; do
            "server/$script" --help > /dev/null
          done

      # lib.sh's lookups run under the scripts' set -euo pipefail, where a
      # failing command inside one ends the whole script without a message.
      - name: Check the lib.sh lookups
        run: |
          bash -c '
            source server/lib.sh
            reverb_conf=/tmp/deploy-kit-ci/missing.conf
            value=$(reverb_setting domain)
            [[ -z $value ]] || { echo "reverb_setting without a file gave: $value"; exit 1; }
            mkdir -p /tmp/deploy-kit-ci
            reverb_conf=/tmp/deploy-kit-ci/reverb.conf
            printf "%s\n" "# comment" "domain=old.example.com" "domain=reverb.example.com" "port=8090" > "$reverb_conf"
            [[ $(reverb_setting domain) == reverb.example.com && $(reverb_setting port) == 8090 && -z $(reverb_setting apps) ]] \
              || { echo "reverb_setting read the file wrongly"; exit 1; }
            echo "lookups ok"
          '
