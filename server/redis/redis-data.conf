# deploy-kit: Redis for Laravel sessions and queues, shared by every domain on
# the server. Installed by server/setup-redis as /etc/redis/redis-data.conf and
# run by systemd as redis-server@data. It never evicts (a full instance refuses
# writes instead of dropping sessions or jobs) and is saved to disk: an
# append-only file synced every second, plus snapshots.
#
# Every domain logs in as its own ACL user (named after the domain) that can
# only use keys under "<domain>:"; see server/README.md.

bind 127.0.0.1 -::1
protected-mode yes
port 6381

pidfile /run/redis-data/redis-server.pid
logfile /var/log/redis/redis-server-data.log
dir /var/lib/redis/data
aclfile /etc/redis/users-data.acl

maxmemory 512mb
maxmemory-policy noeviction

appendonly yes
appendfsync everysec
save 3600 1 300 100 60 10000
