# deploy-kit: Redis for Laravel caches, shared by every domain on the server.
# Installed by server/setup-redis as /etc/redis/redis-cache.conf and run by
# systemd as redis-server@cache. When full it evicts the least recently used
# keys; nothing is saved to disk, so a restart starts with an empty cache.
#
# Every domain logs in as its own ACL user (named after the domain) that can
# only use keys under "<domain>:"; see server/README.md.

bind 127.0.0.1 -::1
protected-mode yes
port 6380

pidfile /run/redis-cache/redis-server.pid
logfile /var/log/redis/redis-server-cache.log
dir /var/lib/redis/cache
aclfile /etc/redis/users-cache.acl

maxmemory 256mb
maxmemory-policy allkeys-lru

save ""
appendonly no
